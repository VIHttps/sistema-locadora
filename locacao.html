<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Locadora - Nova Locação</title>
    <link rel="stylesheet" href="_css/estilos.css">
    <link rel="stylesheet" href="_css/locacao.css">
</head>
<body>

    <header>
        <h1>Sistema de <span id="locadora">Locadora</span></h1>
        
        <nav class="menu-principal">
            <a href="index.html">Início</a>
            <a href="clientes.html">Clientes</a>
            <a href="filmes.html">Filmes</a>
            <a href="categorias.html">Categorias</a>
            <a href="locacao.html" class="active destaque">Nova Locação ➔</a>
        </nav>
    </header>

    <main>
        <section class="secao-cadastro-locacao">
            <h2>Registrar Nova Locação</h2>
            <p>Preencha os dados do cliente e adicione os filmes desejados abaixo cuidando do controle de estoque.</p>

            <form id="formLocacao">
                <div class="linha-formulario">
                    <div class="grupo-campo campo-grande">
                        <label for="selCliente">Cliente:</label>
                        <select id="selCliente" required>
                            <option value="">Selecione um cliente...</option>
                        </select>
                    </div>

                    <div class="grupo-campo campo-medio">
                        <label for="txtDataLocacao">Data da Locação:</label>
                        <input type="date" id="txtDataLocacao" required>
                    </div>
                </div>

                <hr class="divisor-locacao">

                <h3>Filmes Selecionados</h3>
                <div id="containerItensLocacao">
                    </div>

                <div class="bloco-adicionar-item">
                    <button type="button" id="btnAdicionarItem" class="btn-secundario">+ Adicionar Outro Filme</button>
                </div>

                <div class="acoes-locacao">
                    <button type="submit" class="btn-sucesso-largo">Finalizar e Registrar Locação</button>
                    <button type="button" id="btnCancelarLocacao" class="btn-neutro-largo">Limpar Formulário</button>
                </div>
            </form>
        </section>
    </main>

    <script src="_javascript/locacao.js"></script>
</body>
</html>
